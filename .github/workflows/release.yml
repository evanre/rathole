name: Release

on:
  push:
    branches: ["*"]

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Cross build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
            exe: rathole
            cross: true
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          default: true

      - name: Install Musl Tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get install musl-tools

      # Native build
      - name: Install target
        if: matrix.cross == false
        run: rustup target add ${{ matrix.target }}

      - name: Build release
        if: matrix.cross == false
        run: cargo build --release --target ${{ matrix.target }}

      # Cross build
      - name: Install cargo-binstall
        if: matrix.cross
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Install cross
        if: matrix.cross
        run: cargo binstall --no-confirm cross

      - name: Build custom Docker image for cross
        if: matrix.cross
        run: docker build -t cross-riscv64gc-musl:local -f Dockerfile.riscv64gc-unknown-linux-musl .

      - name: Build release
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} --features embedded --no-default-features

      - name: Verify build output
        run: |
          ls -la target/${{ matrix.target }}/release/
          file target/${{ matrix.target }}/release/${{ matrix.exe }}
          echo "Binary size: $(du -h target/${{ matrix.target }}/release/${{ matrix.exe }} | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: rathole-${{ matrix.target }}-${{ github.sha }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}

      - name: Zip Release
        uses: TheDoctor0/zip-release@0.6.1
        with:
          type: zip
          filename: rathole-${{ matrix.target }}-${{ github.sha }}.zip
          directory: target/${{ matrix.target }}/release/
          path: ${{ matrix.exe }}
